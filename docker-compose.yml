name: depix-ecommerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: depix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-depix_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-depix_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: depix-redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa:
    build:
      context: ./medusa
      dockerfile: Dockerfile
    container_name: depix-medusa
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    volumes:
      - medusa_uploads:/app/static
      - medusa_media_uploads:/app/uploads
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${MEDUSA_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/depix_db?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${MEDUSA_JWT_SECRET:-supersecret}
      COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET:-supersecret}
      DISABLE_MEDUSA_ADMIN: ${DISABLE_MEDUSA_ADMIN:-true}
      SKIP_OTP: ${SKIP_OTP:-false}
      PAYMENT_ENV: ${PAYMENT_ENV:-sandbox}
      APP_URL: ${APP_URL:-}
      ZIBAL_MERCHANT: ${ZIBAL_MERCHANT:-}
      ZIBAL_CALLBACK_URL: ${ZIBAL_CALLBACK_URL:-}
      PAYMENT_TIMEOUT_MS: ${PAYMENT_TIMEOUT_MS:-15000}
      PORT: 9000
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: depix-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      medusa:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  medusa_uploads:
  medusa_media_uploads:
