name: depix-ecommerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: depix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-depix_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: depix-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  medusa:
    image: node:20-alpine
    container_name: depix-medusa
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./medusa:/app
      - medusa_node_modules:/app/node_modules
    ports:
      - "${MEDUSA_PORT:-9000}:9000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${MEDUSA_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${MEDUSA_DB_NAME:-medusa_db}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${MEDUSA_JWT_SECRET:-}
      COOKIE_SECRET: ${MEDUSA_COOKIE_SECRET:-}
      PORT: 9000
    command: sh -c "corepack enable && yarn dev"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payload:
    image: node:20-alpine
    container_name: depix-payload
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./payload:/app
      - payload_node_modules:/app/node_modules
    ports:
      - "${PAYLOAD_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${PAYLOAD_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${PAYLOAD_DB_NAME:-payload_db}}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-}
      PORT: 3000
    command: sh -c "corepack enable && pnpm dev"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: depix-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - medusa
      - payload

volumes:
  postgres_data:
  redis_data:
  medusa_node_modules:
  payload_node_modules:
