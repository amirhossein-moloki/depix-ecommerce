              properties:
                phone:
                  type: string
                  example: 09123456789
                code:
                  type: string
                  example: '00000'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                type: object
                required:
                - token
                - customer
                properties:
                  token:
                    type: string
                  customer:
                    type: object
        '400':
          $ref: '#/components/responses/BadRequest'
