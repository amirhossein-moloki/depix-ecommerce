components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication bearer token for customer or admin session.
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie authentication.
  responses:
    BadRequest:
      description: Invalid client request parameters or payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - message
      - type
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
    Brand:
      type: object
      required:
      - id
      - name
      - slug
      - is_active
      properties:
        id:
          type: string
        name:
          type: string
