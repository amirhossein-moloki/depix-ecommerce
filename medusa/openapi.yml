    post:
      summary: Apply Promotion / Discount Code to Cart
      description: >
        Applies one or more active promotion codes to the cart and recomputes item and shipping
        adjustments. Inactive, draft, soft-deleted, or expired promotion codes (or codes belonging
        to an inactive or expired campaign) are rejected with HTTP 400 Bad Request.
      tags:
      - Carts & Checkout
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                promo_codes:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Updated cart with discount_total (IRR)
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart:
                    $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid, inactive, draft, deleted, or expired promotion code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
