      description: Attaches a shipping method to the cart. Supports dynamic Postex quote calculation (`postex_post` with `data.to_city_code`, applying active `FreeShippingRule` discounts) and Tabriz local courier (`tabriz_courier` with `shipping_total = 0` and pay-on-delivery metadata).
      tags:
      - Carts & Checkout
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - option_id
              properties:
                option_id:
                  type: string
                  description: Shipping option ID, `postex_post`, or `tabriz_courier`.
                data:
                  type: object
                  properties:
                    to_city_code:
                      type: integer
                      description: Destination city code required for `postex_post`.
                    courier_code:
                      type: string
                      description: Optional Postex courier code (defaults to `IR_POST`).
                    box_size_id:
                      type: integer
                      description: Optional Postex box size identifier.
                  additionalProperties: true
      responses:
        '200':
          description: Updated cart with shipping_total and total (IRR)
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart:
                    $ref: '#/components/schemas/Cart'
