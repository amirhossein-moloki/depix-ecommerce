      operationId: getGlobalInventoryHistory
      description: Retrieve paginated audit trail of inventory balance adjustments
        and transactions across all products, enriched with `product_title`,
        `variant_title`, `sku`, and `actor_name`.
      tags:
      - Admin Inventory
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
