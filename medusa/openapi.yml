      operationId: sendPhoneOtpCode
      description: Dispatch verification OTP code to customer's Iranian mobile number
        (`09...` or `+989...`). In development environments with `SKIP_OTP=true`, code '00000' is set and SMS sending is bypassed.
      tags:
      - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
              properties:
                phone:
                  type: string
                  example: 09123456789
      responses:
        '200':
          description: OTP code sent successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                properties:
                  success:
                    type: boolean
                    example: true
                  phone:
                    type: string
                    example: "+989123456789"
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
