      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - variant_id
              properties:
                product_id:
                  type: string
                variant_id:
                  type: string
                quantity:
                  type: integer
                  minimum: 0
                  description: Target absolute inventory quantity.
                delta:
                  type: integer
                  description: Relative inventory change (used when quantity is omitted).
                reason:
                  type: string
                  default: manual_adjustment
                location_id:
                  type: string
                note:
                  type: string
                reference_type:
                  type: string
                reference_id:
                  type: string
      responses:
        '200':
          description: Inventory updated and transaction recorded.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - product_id
                - variant_id
                - location_id
                - quantity_before
                - quantity_change
                - quantity_after
                - inventory_quantity
                properties:
                  success:
                    type: boolean
                  product_id:
                    type: string
                  variant_id:
                    type: string
                  location_id:
                    type: string
                  quantity_before:
                    type: integer
                  quantity_change:
                    type: integer
                  quantity_after:
                    type: integer
                  inventory_quantity:
                    type: integer
                  inventory_level_id:
                    type: string
                    nullable: true
                  transaction:
                    $ref: '#/components/schemas/InventoryTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
