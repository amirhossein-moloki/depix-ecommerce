openapi: 3.0.0
info:
  title: Depix E-Commerce Backend API (Medusa v2)
  version: 2.21.2
  description: Comprehensive OpenAPI 3.0 specification for Depix E-Commerce backend
    services including Storefront, Admin Management, Phone OTP Authentication, Customer
    Addresses & Profiles, Notifications, Inventory Audit, Support Ticketing System,
    Size Guides, Product Videos, Reviews, Recommendations, Price & Stock Alerts, Comparison,
    Wishlist, Digital Wallet, Orders, Carts, and Invoices.
servers:
- url: http://localhost:9000
  description: Local Medusa Backend
- url: http://localhost/api/medusa
  description: Nginx Reverse Proxy Gateway
security:
- bearerAuth: []
- cookieAuth: []
paths:
  /store/brands:
    get:
      summary: List Public Brands
      operationId: listPublicBrands
      description: Retrieve a paginated list of publicly active brands.
      tags:
      - Store Brands
      security: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A list of active brands.
          content:
            application/json:
              schema:
                type: object
                required:
                - brands
                - count
                - offset
                - limit
                properties:
                  brands:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
  /store/brands/{id}:
    get:
      summary: Get Public Brand
      operationId: getPublicBrand
      description: Retrieve public details of an active brand by ID or slug.
      tags:
      - Store Brands
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Active brand details.
          content:
            application/json:
              schema:
                type: object
                required:
                - brand
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/brands:
    get:
      summary: List Admin Brands
      operationId: listAdminBrands
      description: Retrieve a list of all brands including inactive ones.
      tags:
      - Admin Brands
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Paginated brand list for admin.
          content:
            application/json:
              schema:
                type: object
                required:
                - brands
                - count
                - offset
                - limit
                properties:
                  brands:
                    type: array
                    items:
                      $ref: '#/components/schemas/Brand'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create Brand
      operationId: createAdminBrand
      description: Create a new brand. Enforces slug uniqueness.
      tags:
      - Admin Brands
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - slug
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                logo_id:
                  type: string
                is_active:
                  type: boolean
                  default: true
                metadata:
                  type: object
      responses:
        '201':
          description: Brand created successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - brand
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/brands/{id}:
    get:
      summary: Get Admin Brand Details
      operationId: getAdminBrand
      tags:
      - Admin Brands
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Brand details.
          content:
            application/json:
              schema:
                type: object
                required:
                - brand
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update Brand
      operationId: updateAdminBrand
      tags:
      - Admin Brands
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                logo_id:
                  type: string
                is_active:
                  type: boolean
                metadata:
                  type: object
      responses:
        '200':
          description: Brand updated successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - brand
                properties:
                  brand:
                    $ref: '#/components/schemas/Brand'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete Brand
      operationId: deleteAdminBrand
      description: Safely deletes brand if not referenced by products.
      tags:
      - Admin Brands
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Brand deleted successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - object
                - deleted
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    example: brand
                  deleted:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /store/categories:
    get:
      summary: List Public Categories
      operationId: listPublicCategories
      tags:
      - Store Categories
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: parent_category_id
        in: query
        schema:
          type: string
      - name: q
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of active, publishable categories.
          content:
            application/json:
              schema:
                type: object
                required:
                - categories
                - count
                - offset
                - limit
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
  /store/categories/{id}:
    get:
      summary: Get Public Category
      operationId: getPublicCategory
      tags:
      - Store Categories
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public category details.
          content:
            application/json:
              schema:
                type: object
                required:
                - category
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/categories:
    get:
      summary: List Admin Categories
      operationId: listAdminCategories
      tags:
      - Admin Categories
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      - name: is_active
        in: query
        schema:
          type: boolean
      - name: parent_category_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: List of categories for admin.
          content:
            application/json:
              schema:
                type: object
                required:
                - categories
                - count
                - offset
                - limit
                properties:
                  categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create Category
      operationId: createAdminCategory
      tags:
      - Admin Categories
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                image_id:
                  type: string
                is_active:
                  type: boolean
                display_order:
                  type: integer
                parent_category_id:
                  type: string
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                type: object
                required:
                - category
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/categories/{id}:
    get:
      summary: Get Admin Category
      operationId: getAdminCategory
      tags:
      - Admin Categories
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Category details.
          content:
            application/json:
              schema:
                type: object
                required:
                - category
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update Category
      operationId: updateAdminCategory
      tags:
      - Admin Categories
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                description:
                  type: string
                image_id:
                  type: string
                is_active:
                  type: boolean
                display_order:
                  type: integer
                parent_category_id:
                  type: string
      responses:
        '200':
          description: Category updated.
          content:
            application/json:
              schema:
                type: object
                required:
                - category
                properties:
                  category:
                    $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete Category
      operationId: deleteAdminCategory
      tags:
      - Admin Categories
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Category deleted, products preserved.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - object
                - deleted
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    example: category
                  deleted:
                    type: boolean
                    example: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/media/upload:
    post:
      summary: Upload Media File
      operationId: uploadAdminMedia
      description: Uploads a media file with buffer magic-byte MIME validation, size
        limit enforcement, and dimensions calculation.
      tags:
      - Admin Media
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Media uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - media
                properties:
                  media:
                    $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/media:
    get:
      summary: List Media Library
      operationId: listAdminMedia
      tags:
      - Admin Media
      security:
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: offset
        in: query
        schema:
          type: integer
      - name: q
        in: query
        schema:
          type: string
      - name: mime_type
        in: query
        schema:
          type: string
      - name: uploaded_by_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Paginated media library.
          content:
            application/json:
              schema:
                type: object
                required:
                - media
                - count
                - offset
                - limit
                properties:
                  media:
                    type: array
                    items:
                      $ref: '#/components/schemas/Media'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/media/{id}:
    get:
      summary: Get Media Metadata
      operationId: getAdminMedia
      tags:
      - Admin Media
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Media details.
          content:
            application/json:
              schema:
                type: object
                required:
                - media
                properties:
                  media:
                    $ref: '#/components/schemas/Media'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete Media
      operationId: deleteAdminMedia
      description: Deletes media from DB and disk if not referenced by brands, categories,
        or products.
      tags:
      - Admin Media
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Media deleted successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - object
                - deleted
                properties:
                  id:
                    type: string
                  object:
                    type: string
                    example: media
                  deleted:
                    type: boolean
                    example: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /store/reviews/media:
    post:
      summary: Upload Customer Review Image
      operationId: uploadStoreReviewMedia
      tags:
      - Store Reviews
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded for review attachment.
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                properties:
                  url:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /admin/settings:
    get:
      summary: Get Store Settings
      operationId: getStoreSettings
      description: Retrieve global store settings, notification toggles, return window
        parameters, tax rates, and associated store addresses.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current store settings object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update Store Settings
      operationId: updateStoreSettings
      description: Update editable store settings attributes (e.g., storeName, supportEmail,
        taxRate, returnWindowDays, notification toggles). Rejects server-managed fields.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                storeName:
                  type: string
                contactPhone:
                  type: string
                supportEmail:
                  type: string
                address:
                  type: string
                taxRate:
                  type: number
                enableSmsNotifications:
                  type: boolean
                enableEmailNotifications:
                  type: boolean
                returnWindowDays:
                  type: integer
                autoApproveReturns:
                  type: boolean
                defaultShippingAddressId:
                  type: string
                  nullable: true
                defaultReturnAddressId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Updated store settings object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/settings/addresses:
    get:
      summary: List Store Addresses
      operationId: listStoreAddresses
      description: Retrieve all configured store physical addresses alongside current
        default shipping/return ID pointers.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      responses:
        '200':
          description: List of store addresses with default pointers.
          content:
            application/json:
              schema:
                type: object
                required:
                - addresses
                - defaultShippingAddressId
                - defaultReturnAddressId
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreAddress'
                  defaultShippingAddressId:
                    type: string
                    nullable: true
                  defaultReturnAddressId:
                    type: string
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create Store Address
      operationId: createStoreAddress
      description: Create a new physical store address with Iranian 10-digit postal
        code and phone validation.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - title
              - recipientName
              - phone
              - province
              - city
              - address
              - postalCode
              properties:
                title:
                  type: string
                recipientName:
                  type: string
                phone:
                  type: string
                province:
                  type: string
                city:
                  type: string
                address:
                  type: string
                plaque:
                  type: string
                  nullable: true
                floor:
                  type: string
                  nullable: true
                postalCode:
                  type: string
      responses:
        '201':
          description: Store address created.
          content:
            application/json:
              schema:
                type: object
                required:
                - address
                properties:
                  address:
                    $ref: '#/components/schemas/StoreAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/settings/addresses/{id}:
    patch:
      summary: Update Store Address
      operationId: updateStoreAddress
      description: Update fields of an existing store address.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                recipientName:
                  type: string
                phone:
                  type: string
                province:
                  type: string
                city:
                  type: string
                address:
                  type: string
                plaque:
                  type: string
                  nullable: true
                floor:
                  type: string
                  nullable: true
                postalCode:
                  type: string
      responses:
        '200':
          description: Updated store address.
          content:
            application/json:
              schema:
                type: object
                required:
                - address
                properties:
                  address:
                    $ref: '#/components/schemas/StoreAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete Store Address
      operationId: deleteStoreAddress
      description: Delete a store address and automatically reassign defaults if necessary.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Address deletion response.
          content:
            application/json:
              schema:
                type: object
                required:
                - deleted
                - id
                properties:
                  deleted:
                    type: boolean
                    example: true
                  id:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/settings/default-shipping-address:
    put:
      summary: Set Default Shipping Address
      operationId: setDefaultShippingAddress
      description: Set the active default shipping origin address ID for store dispatch.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - addressId
              properties:
                addressId:
                  type: string
      responses:
        '200':
          description: Updated store settings with new default shipping address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/settings/default-return-address:
    put:
      summary: Set Default Return Address
      operationId: setDefaultReturnAddress
      description: Set the active default return destination address ID for customer
        returns.
      tags:
      - Admin Store Settings
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - addressId
              properties:
                addressId:
                  type: string
      responses:
        '200':
          description: Updated store settings with new default return address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /store/notifications:
    get:
      summary: List Customer Notifications
      operationId: listStoreNotifications
      description: Retrieve paginated notifications for the authenticated customer.
      tags:
      - Store Notifications
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: is_read
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Paginated notification list.
          content:
            application/json:
              schema:
                type: object
                required:
                - notifications
                - count
                - offset
                - limit
                properties:
                  notifications:
                    type: array
                    items:
