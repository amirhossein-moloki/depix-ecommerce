              schema:
                type: object
                properties:
                  returns:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReturnRequest'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
  /admin/returns/{id}:
    get:
      summary: Get Return Request Details (Admin)
      tags:
      - Admin Returns (RMA)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Return request details
          content:
            application/json:
              schema:
                type: object
                properties:
                  return:
                    $ref: '#/components/schemas/ReturnRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/returns/{id}/approve:
    post:
      summary: Approve Return Request
      tags:
      - Admin Returns (RMA)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Approved return request
          content:
            application/json:
              schema:
                type: object
                properties:
                  return_request:
                    $ref: '#/components/schemas/ReturnRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/returns/{id}/reject:
    post:
      summary: Reject Return Request
      tags:
      - Admin Returns (RMA)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reject_reason:
                  type: string
                  nullable: true
                admin_note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Rejected return request
          content:
            application/json:
              schema:
                type: object
                properties:
                  return_request:
                    $ref: '#/components/schemas/ReturnRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/returns/{id}/receive:
    post:
      summary: Mark Return Package Received at Warehouse
      tags:
      - Admin Returns (RMA)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                received_at:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Return marked as received
          content:
            application/json:
              schema:
                type: object
                properties:
                  return_request:
                    $ref: '#/components/schemas/ReturnRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/returns/{id}/inspect:
    post:
      summary: Inspect Returned Items (Auto-Restores Inventory if Sellable)
      tags:
      - Admin Returns (RMA)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - result
              properties:
                result:
                  type: string
                  enum:
                  - sellable
                  - damaged
                  - unsellable
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Inspection recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  return_request:
                    $ref: '#/components/schemas/ReturnRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/returns/{id}/refund:
    post:
      summary: Record Return Refund to Customer
      tags:
      - Admin Returns (RMA)
      security:
      - bearerAuth: []
      - cookieAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - amount_irr
              - reference_id
              properties:
                amount_irr:
                  type: number
                  minimum: 0
                reference_id:
                  type: string
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Refund recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  return_request:
                    $ref: '#/components/schemas/ReturnRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT authentication bearer token for customer or admin session.
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session cookie authentication.
  responses:
    BadRequest:
      description: Invalid client request parameters or payload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication token missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - message
      - type
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
    Brand:
      type: object
      required:
      - id
      - name
      - slug
      - is_active
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        logo_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      required:
      - id
      - name
      - slug
      - is_active
      properties:
        id:
          type: string
        name:
          type: string
        handle:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        image_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_internal:
          type: boolean
        rank:
          type: integer
        display_order:
          type: integer
        parent_category_id:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Media:
      type: object
      required:
      - id
      - original_filename
      - file_key
      - url
      properties:
        id:
          type: string
        original_filename:
          type: string
        file_key:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        storage_provider:
          type: string
        url:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        uploaded_by_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StoreAddress:
      type: object
      required:
      - id
      - title
      - recipientName
      - phone
      - province
      - city
      - address
      - postalCode
      properties:
        id:
          type: string
        title:
          type: string
        recipientName:
          type: string
        recipient_name:
          type: string
        phone:
          type: string
        province:
          type: string
        city:
          type: string
        address:
          type: string
        plaque:
          type: string
          nullable: true
        floor:
          type: string
          nullable: true
        postalCode:
          type: string
        postal_code:
          type: string
        postexCityCode:
          type: integer
          nullable: true
          description: Postex origin city code for shipping quote calculation
        postex_city_code:
          type: integer
          nullable: true
        isDefaultShipping:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StoreContactPhone:
      type: object
      required:
      - label
      - number
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 40
        number:
          type: string
    StoreSocialLink:
      type: object
      required:
      - platform
      - url
      properties:
        platform:
          type: string
          enum:
          - instagram
          - whatsapp
          - telegram
          - aparat
          - linkedin
          - youtube
        url:
          type: string
          format: uri
          maxLength: 2048
    PublicStoreSettings:
      type: object
      required:
      - storeName
      - logoUrl
      - brandDescription
      - address
      - contactPhones
      - socialLinks
      - updatedAt
      properties:
        storeName:
          type: string
          minLength: 2
          maxLength: 60
        logoUrl:
          type: string
          nullable: true
        brandDescription:
          type: string
          maxLength: 300
        address:
          type: string
          maxLength: 300
        contactPhones:
          type: array
          minItems: 0
          maxItems: 5
          items:
            $ref: '#/components/schemas/StoreContactPhone'
        socialLinks:
          type: array
          minItems: 0
          maxItems: 6
          items:
            $ref: '#/components/schemas/StoreSocialLink'
        updatedAt:
          type: string
          format: date-time
    StoreSettings:
      type: object
      required:
      - id
      - storeName
      - logoId
      - logoUrl
      - brandDescription
      - contactPhone
      - contactPhones
      - socialLinks
      - supportEmail
      - address
      - taxRate
      - enableSmsNotifications
      - enableEmailNotifications
      - returnWindowDays
      - autoApproveReturns
      - addresses
      properties:
        id:
          type: string
        storeName:
          type: string
          minLength: 2
          maxLength: 60
        logoId:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        brandDescription:
          type: string
          maxLength: 300
        contactPhone:
          type: string
        contactPhones:
          type: array
          items:
            $ref: '#/components/schemas/StoreContactPhone'
        socialLinks:
          type: array
          items:
            $ref: '#/components/schemas/StoreSocialLink'
        supportEmail:
          type: string
        address:
          type: string
          maxLength: 300
        taxRate:
          type: number
        enableSmsNotifications:
          type: boolean
        enableEmailNotifications:
          type: boolean
        returnWindowDays:
          type: integer
        autoApproveReturns:
          type: boolean
        defaultShippingAddressId:
          type: string
          nullable: true
        defaultReturnAddressId:
          type: string
          nullable: true
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/StoreAddress'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Notification:
      type: object
      required:
      - id
      - receiver_id
      - channel
      - template
      - data
      properties:
        id:
          type: string
        receiver_id:
          type: string
        channel:
          type: string
        template:
          type: string
        data:
          type: object
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    InventoryTransaction:
      type: object
      required:
      - id
      - inventory_item_id
      - quantity_change
      - type
      properties:
        id:
          type: string
        inventory_item_id:
          type: string
        inventory_level_id:
          type: string
          nullable: true
        product_id:
          type: string
          nullable: true
        product_title:
          type: string
          nullable: true
        variant_id:
          type: string
          nullable: true
        variant_title:
          type: string
          nullable: true
        sku:
          type: string
          nullable: true
        location_id:
          type: string
          nullable: true
        quantity_before:
          type: integer
        quantity_change:
          type: integer
        quantity_after:
          type: integer
        type:
          type: string
          enum:
          - increase
          - decrease
        reason:
          type: string
          enum:
          - initial_stock
          - purchase
          - sale
          - cancellation
          - return
          - damaged
          - manual_adjustment
          - inventory_count
        note:
          type: string
          nullable: true
        reference_type:
          type: string
          nullable: true
        reference_id:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
        actor_name:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    Ticket:
      type: object
      required:
      - id
      - ticket_number
      - customer_id
      - category_id
      - subject
      - status
      - priority
      properties:
        id:
          type: string
        ticket_number:
          type: string
          example: TKT-2026-000123
        customer_id:
          type: string
        user_id:
          type: string
          description: Legacy alias for customer_id.
        customer_name:
          type: string
          nullable: true
          description: Customer full name resolved from the Customer module.
        customer_phone:
          type: string
          nullable: true
          description: Customer phone number resolved from the Customer module.
        category_id:
          type: string
        subject:
          type: string
        status:
          type: string
          enum:
          - open
          - in_progress
          - waiting_for_customer
          - answered
          - resolved
          - closed
        priority:
          type: string
          enum:
          - low
          - normal
          - high
        order_id:
          type: string
          nullable: true
        product_id:
          type: string
          nullable: true
        assigned_to_id:
          type: string
          nullable: true
        assigned_to:
          type: string
          nullable: true
          description: Legacy alias for assigned_to_id.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SizeGuideTemplate:
      type: object
      required:
      - id
      - title
      - columns
      - rows
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProductBrandSummary:
      type: object
      required:
      - id
      - name
      - slug
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logo_id:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    Product:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        description:
          type: string
        handle:
          type: string
        is_giftcard:
          type: boolean
        status:
          type: string
        thumbnail:
          type: string
        brand:
          allOf:
          - $ref: '#/components/schemas/ProductBrandSummary'
          nullable: true
          description: Resolved brand summary hydrated from product metadata
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        realPrice:
          type: number
          nullable: true
          description: Original / compare-at price in IRR
        finalPrice:
          type: number
          nullable: true
          description: Effective selling price in IRR
        discount:
          type: number
          description: Discount percentage (0 if no discount)
        stock:
          type: boolean
          description: Whether at least one variant is in stock
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariant'
    BulkImportCategoryInput:
      type: object
      description: Category lookup or creation payload (at least one of id, slug, or name is required).
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        parent_slug:
          type: string
          nullable: true
        parent_name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        image_id:
          type: string
          nullable: true
        display_order:
          type: integer
        is_active:
          type: boolean
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    BulkImportBrandInput:
      type: object
      description: Brand lookup or creation payload (at least one of id, slug, or name is required).
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        logo_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    BulkImportOptionInput:
      type: object
      required:
      - title
      - values
      properties:
        title:
          type: string
        values:
          type: array
          minItems: 1
          items:
            type: string
    BulkImportVariantInput:
      type: object
      description: Variant specification (at least one of price_irr or price is required).
      properties:
        title:
          type: string
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        ean:
          type: string
          nullable: true
        upc:
          type: string
          nullable: true
        price_irr:
          type: number
          minimum: 0
        price:
          type: number
          minimum: 0
        compare_at_price_irr:
          type: number
          minimum: 0
          nullable: true
        compare_at_price:
          type: number
          minimum: 0
          nullable: true
        stock:
          type: integer
          minimum: 0
        manage_inventory:
          type: boolean
          default: true
        allow_backorder:
          type: boolean
          default: false
        options:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          nullable: true
          additionalProperties: true
    BulkImportProductInput:
      type: object
      required:
      - title
      properties:
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        handle:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - draft
          - proposed
          - published
          - rejected
          default: published
        category:
          allOf:
          - $ref: '#/components/schemas/BulkImportCategoryInput'
          nullable: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/BulkImportCategoryInput'
        brand:
          allOf:
          - $ref: '#/components/schemas/BulkImportBrandInput'
          nullable: true
        thumbnail:
          type: string
          nullable: true
        images:
          type: array
          items:
            oneOf:
            - type: string
            - type: object
              required:
              - url
              properties:
                url:
                  type: string
        tags:
          type: array
          items:
            oneOf:
            - type: string
            - type: object
              required:
              - value
              properties:
                id:
                  type: string
                value:
                  type: string
        specifications:
          type: array
          items:
            type: object
            required:
            - label
            - value
            properties:
              label:
                type: string
              value:
                type: string
        color_hex_map:
          type: object
          additionalProperties:
            type: string
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/BulkImportOptionInput'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/BulkImportVariantInput'
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        ean:
          type: string
          nullable: true
        upc:
          type: string
          nullable: true
        price_irr:
          type: number
          minimum: 0
        price:
          type: number
          minimum: 0
        compare_at_price_irr:
          type: number
          minimum: 0
          nullable: true
        compare_at_price:
          type: number
          minimum: 0
          nullable: true
        stock:
          type: integer
          minimum: 0
        manage_inventory:
          type: boolean
        allow_backorder:
          type: boolean
    AdminBulkImportProductsRequest:
      type: object
      required:
      - products
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - upsert
          - skip
          - create_only
          default: upsert
        dry_run:
          type: boolean
          default: false
        price_unit:
          type: string
          enum:
          - irr
          - irt
          default: irr
          description: Unit of incoming prices (irr = Rials, irt = Tomans converted x10 to IRR).
        download_images:
          type: boolean
          default: false
          description: Reserved for SSRF-safe remote image download in future versions (v1 stores direct URLs).
        products:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BulkImportProductInput'
    AdminBulkImportProductItemResult:
      type: object
      required:
      - index
      - handle
      - title
      - status
      - product_id
      - category_ids
      - brand_id
      - variants_created
      - variants_updated
      - warnings
      - errors
      properties:
        index:
          type: integer
        handle:
          type: string
        title:
          type: string
        status:
          type: string
          enum:
          - created
          - updated
          - skipped
          - would_create
          - would_update
          - would_skip
          - failed
        product_id:
          type: string
          nullable: true
        category_ids:
          type: array
          items:
            type: string
        brand_id:
          type: string
          nullable: true
        variants_created:
          type: integer
        variants_updated:
          type: integer
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
    AdminBulkImportProductsResponse:
      type: object
      required:
      - dry_run
      - mode
      - price_unit
      - download_images
      - summary
      - warnings
      - results
      properties:
        dry_run:
          type: boolean
        mode:
          type: string
          enum:
          - upsert
          - skip
          - create_only
        price_unit:
          type: string
          enum:
          - irr
          - irt
        download_images:
          type: boolean
        summary:
          type: object
          required:
          - total
          - created
          - updated
          - skipped
          - failed
          - categories_created
          - brands_created
          properties:
            total:
              type: integer
            created:
              type: integer
            updated:
              type: integer
            skipped:
              type: integer
            failed:
              type: integer
            categories_created:
              type: integer
