    post:
      summary: Update Order Status & Fulfillment Metadata (Admin)
      operationId: updateAdminOrderStatus
      description: Transitions an order's operational status (`pending`, `confirmed`, `processing`, `shipped`, `delivered`, `completed`, `canceled`, `archived`, `requires_action`) and syncs core status plus `metadata.order_status`, `metadata.fulfillment_status`, and `status_history`.
