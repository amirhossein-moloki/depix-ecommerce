    post:
      summary: Verify Phone OTP Code
      operationId: verifyPhoneOtpCode
      description: Verify OTP code and issue JWT session token for customer. In dev environments with `SKIP_OTP=true`, entering '00000' is accepted directly. Customer email/password authentication is disabled in favor of phone OTP.
      tags:
      - Authentication
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - phone
