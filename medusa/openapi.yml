      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: status
        in: query
        schema:
          type: string
      - name: fulfillment_status
        in: query
        schema:
          type: string
      - name: payment_status
        in: query
        schema:
          type: string
      - name: customer_id
        in: query
        description: Filter orders by customer ID (supports a single customer ID or an array of customer IDs).
        schema:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
