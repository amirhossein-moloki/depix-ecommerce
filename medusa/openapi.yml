  /store/carts/{id}/payment-sessions:
    post:
      summary: Initiate Payment Gateway Session for Cart
      description: Initiates a payment gateway session for the cart. When called with a valid customer Bearer token on a guest cart, customer_id is automatically attached before creating the payment session.
      tags:
      - Carts & Checkout
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  enum:
                  - zarinpal
                  - zibal
                  default: zarinpal
                callback_url:
                  type: string
                  format: uri
                  description: Optional override callback URL (defaults to ZIBAL_CALLBACK_URL when provider is zibal)
                idempotency_key:
                  type: string
      responses:
        '200':
          description: Payment gateway redirect URL and tracking identifier
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_id:
                    type: string
                  redirect_url:
                    type: string
                  track_id:
                    type: string
                  authority:
                    type: string
                  amount_irr:
                    type: number
                  provider:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /store/payments/initiate:
    post:
      summary: Initiate Online Payment Gateway Session
      description: 'Initiates a payment gateway session. Deterministically recalculates cart total in IRR (`Σ(unit_price × quantity) - discount_total + tax_total + shipping_total`) and sends amounts in IRR (including explicit `currency: "IRR"` for Zarinpal and Rial conversion for Zibal). When called with a valid customer Bearer token on a guest cart, customer_id is automatically attached before creating the payment session.'
      tags:
      - Carts & Checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cart_id
              properties:
                cart_id:
                  type: string
                provider:
                  type: string
                  enum:
                  - zarinpal
                  - zibal
                  default: zarinpal
                callback_url:
                  type: string
                  format: uri
                  description: Optional override callback URL (defaults to ZIBAL_CALLBACK_URL when provider is zibal)
                idempotency_key:
                  type: string
      responses:
        '200':
          description: Payment gateway redirect URL and tracking identifier
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_id:
                    type: string
                  redirect_url:
                    type: string
                  track_id:
                    type: string
                  authority:
                    type: string
                  amount_irr:
                    type: number
                  provider:
                    type: string
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
  /store/payments/verify:
    post:
      summary: Verify Payment Gateway Callback and Complete Order
      description: "Verifies the gateway transaction server-side, attaches authenticated customer to guest carts if applicable, completes the order idempotently, and marks its payment collection as captured (`payment_status: captured`, `summary.paid_total` updated). Returns sanitized gateway error details on verification failure."
      tags:
      - Carts & Checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cart_id:
                  type: string
                payment_id:
                  type: string
                authority:
                  type: string
                track_id:
                  oneOf:
                  - type: string
                  - type: integer
                ref_id:
                  type: string
                status:
                  type: string
                provider:
                  type: string
      responses:
        '200':
          description: Payment verified, order created, and payment captured (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  already_verified:
                    type: boolean
                  payment_id:
                    type: string
                  track_id:
                    type: string
                  order:
                    $ref: '#/components/schemas/Order'
