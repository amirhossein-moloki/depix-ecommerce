        in: query
        schema:
          type: string
      - name: variant_id
        in: query
        schema:
          type: string
      - name: location_id
        in: query
        schema:
          type: string
      - name: type
        in: query
        description: Filter by balance direction (`increase` or `decrease`). Legacy reason aliases (`adjustment`, `sale`, `return`, `cancellation`) are also accepted.
        schema:
          type: string
          enum:
          - increase
          - decrease
      - name: reason
        in: query
        schema:
          type: string
          enum:
          - initial_stock
          - purchase
          - sale
          - cancellation
          - return
          - damaged
          - manual_adjustment
          - inventory_count
      - name: reference_id
        in: query
        schema:
          type: string
      - name: created_by
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Paginated transaction list.
          content:
            application/json:
              schema:
                type: object
                required:
                - history
                - count
                - offset
                - limit
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/InventoryTransaction'
                  count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
