        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - pending
                  - confirmed
                  - processing
                  - shipped
                  - delivered
                  - completed
                  - canceled
                  - cancelled
                  - archived
                  - requires_action
                fulfillment_status:
                  type: string
                  enum:
                  - not_fulfilled
                  - partially_fulfilled
                  - fulfilled
                  - partially_shipped
                  - shipped
                  - partially_delivered
                  - delivered
                  - canceled
                tracking_number:
                  type: string
                  maxLength: 255
                note:
                  type: string
                  maxLength: 1000
                metadata:
                  type: object
