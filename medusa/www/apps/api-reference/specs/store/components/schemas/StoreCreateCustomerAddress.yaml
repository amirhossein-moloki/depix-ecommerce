type: object
description: The address's details.
properties:
  first_name:
    type: string
    title: first_name
    description: The customer's first name.
  last_name:
    type: string
    title: last_name
    description: The customer's last name.
  phone:
    type: string
    title: phone
    description: The customer's phone number. Must be a valid 11-digit mobile number for Iranian addresses (e.g. 09123456789).
  company:
    type: string
    title: company
    description: The address's company.
  address_1:
    type: string
    title: address_1
    description: The address's first line.
  address_2:
    type: string
    title: address_2
    description: The address's second line.
  city:
    type: string
    title: city
    description: The address's city.
  country_code:
    type: string
    title: country_code
    description: The address's two-character ISO country code (e.g., 'ir' or 'us').
  province:
    type: string
    title: province
    description: The address's ISO 3166-2 province code or region name.
    example: tehran
  postal_code:
    type: string
    title: postal_code
    description: The address's postal code. Must be exactly 10 digits for Iranian addresses.
  address_name:
    type: string
    title: address_name
    description: The address's name or label.
  is_default_shipping:
    type: boolean
    title: is_default_shipping
    description: Whether the address is used by default for shipping during checkout.
  is_default_billing:
    type: boolean
    title: is_default_billing
    description: Whether the address is used by default for billing during checkout.
  metadata:
    type: object
    description: Holds custom key-value pairs (e.g., `national_code` required for Iranian addresses).
