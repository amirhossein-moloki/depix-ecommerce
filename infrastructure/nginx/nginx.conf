events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile            on;
    keepalive_timeout   65;
    client_max_body_size 100M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream definition for Medusa Backend
    upstream medusa_backend {
        server medusa:9000;
    }

    # Upstream definition for Blog Backend (Daphne ASGI)
    upstream blog_backend {
        server blog:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Healthcheck endpoint
        location = /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Blog static and media assets served directly from shared volumes
        location /blog/static/ {
            alias /var/www/blog/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /blog/media/ {
            alias /var/www/blog/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Normalize /blog to /blog/
        location = /blog {
            return 301 /blog/;
        }

        # Blog Backend (strips /blog/ prefix; Django uses FORCE_SCRIPT_NAME=/blog)
        location /blog/ {
            proxy_pass http://blog_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_redirect off;
        }

        # Medusa E-commerce Backend API & Admin routes
        location /api/medusa/ {
            proxy_pass http://medusa_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default fallback route -> Medusa Backend
        location / {
            proxy_pass http://medusa_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
